<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Paper Scissors</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
text-align:center;
}

.container{
width:100%;
max-width:480px;
margin:auto;
padding:15px;
}

.card{
background:#1e293b;
border-radius:20px;
padding:25px 18px;
margin-top:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
margin:0 0 10px;
font-size:34px;
}

h2{
margin:8px 0 15px;
}

input{
width:100%;
padding:15px;
border:0;
outline:0;
border-radius:10px;
font-size:17px;
text-align:center;
margin:10px 0;
text-transform:uppercase;
}

button{
border:0;
border-radius:12px;
cursor:pointer;
font-size:16px;
}

.main-btn{
width:100%;
padding:15px;
margin:7px 0;
background:#22c55e;
color:white;
font-weight:bold;
}

.choice{
width:85px;
height:75px;
margin:6px;
font-size:40px;
background:white;
}

.choice:disabled{
opacity:.4;
cursor:not-allowed;
}

.secondary{
background:#3b82f6;
color:white;
padding:14px;
width:100%;
margin-top:10px;
}

.danger{
background:#ef4444;
color:white;
padding:12px 20px;
margin-top:10px;
}

#game{
display:none;
}

.room{
margin:15px 0;
font-size:20px;
}

.room-code{
background:#334155;
padding:8px 15px;
border-radius:10px;
display:inline-block;
letter-spacing:2px;
}

.score{
display:flex;
justify-content:space-around;
background:#334155;
border-radius:14px;
padding:15px;
margin:15px 0;
}

.score strong{
font-size:28px;
}

.timer{
font-size:32px;
font-weight:bold;
margin:18px;
}

.timer.warning{
animation:blink .7s infinite;
}

@keyframes blink{
50%{opacity:.45}
}

.status{
min-height:25px;
margin:12px 0;
}

.result{
min-height:60px;
margin:15px 0;
font-size:24px;
font-weight:bold;
}

.hidden{
display:none!important;
}

.small{
color:#cbd5e1;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOBBY -->

<div id="lobby" class="card">

<h1>🪨 📄 ✂️</h1>

<h2>Stone Paper Scissors</h2>

<p class="small">🎮 2 Player Online</p>

<button id="createBtn" class="main-btn">
🎮 Create Room
</button>

<p>OR</p>

<input
id="roomInput"
maxlength="6"
placeholder="ROOM CODE">

<button id="joinBtn" class="main-btn">
🔗 Join Room
</button>

<p id="lobbyStatus" class="small"></p>

</div>


<!-- GAME -->

<div id="game" class="card">

<h1>🪨 📄 ✂️</h1>

<div class="room">
Room:
<div class="room-code" id="roomCode"></div>
</div>

<div class="score">

<div>
<span id="player1Name">Player 1</span>
<br>
<strong id="score1">0</strong>
</div>

<div>
<span id="player2Name">Player 2</span>
<br>
<strong id="score2">0</strong>
</div>

</div>


<!-- EXACT 60 SECOND TIMER -->

<div class="timer" id="timerBox">
⏱️ <span id="timer">60</span>
</div>


<div id="players" class="status">
⏳ Waiting for Player 2...
</div>

<div id="status" class="status">
Waiting for players...
</div>


<div>

<button class="choice" data-move="stone">
🪨
</button>

<button class="choice" data-move="paper">
📄
</button>

<button class="choice" data-move="scissors">
✂️
</button>

</div>


<div id="result" class="result"></div>


<button
id="newRoundBtn"
class="secondary hidden">
🔄 New Round
</button>


<button
id="leaveBtn"
class="danger">
🚪 Leave Room
</button>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getDatabase,
ref,
set,
get,
update,
remove,
onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyC5nCnRk8rHzEZX7BylT1T9T5lAWPkRQsjw",

authDomain:
"stonepaperscissors-598d1.firebaseapp.com",

databaseURL:
"https://stonepaperscissors-598d1-default-rtdb.firebaseio.com",

projectId:
"stonepaperscissors-598d1",

storageBucket:
"stonepaperscissors-598d1.firebasestorage.app",

messagingSenderId:
"699484749817",

appId:
"1:699484749817:web:861e86fe13c4bf94ef8728",

measurementId:
"G-5HD3MDN5EC"

};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* VARIABLES */

let roomCode="";
let player="";
let myMove="";
let timer=null;
let processingResult=false;


/* ELEMENTS */

const lobby=
document.getElementById("lobby");

const game=
document.getElementById("game");

const roomInput=
document.getElementById("roomInput");

const roomCodeText=
document.getElementById("roomCode");

const playersText=
document.getElementById("players");

const statusText=
document.getElementById("status");

const resultText=
document.getElementById("result");

const timerText=
document.getElementById("timer");

const timerBox=
document.getElementById("timerBox");

const score1Text=
document.getElementById("score1");

const score2Text=
document.getElementById("score2");

const player1NameText=
document.getElementById("player1Name");

const player2NameText=
document.getElementById("player2Name");

const newRoundBtn=
document.getElementById("newRoundBtn");


/* PLAYER NAME */

let myName="Player";

const tg=
window.Telegram &&
window.Telegram.WebApp
? window.Telegram.WebApp
: null;

if(tg){

tg.ready();
tg.expand();

if(
tg.initDataUnsafe &&
tg.initDataUnsafe.user
){

const user=
tg.initDataUnsafe.user;

if(user.username){

myName="@"+user.username;

}
else if(user.first_name){

myName=user.first_name;

}

}

}


/* CREATE ROOM */

document
.getElementById("createBtn")
.addEventListener(
"click",
createRoom
);


async function createRoom(){

try{

roomCode=
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

player="player1";

await set(
ref(db,"rooms/"+roomCode),
{

player1:true,
player2:false,

player1Name:myName,
player2Name:"",

move1:"",
move2:"",

score1:0,
score2:0,

result:"",
finished:false,

round:1

}
);

openGame();

}
catch(error){

console.error(error);

alert(
"Could not create room"
);

}

}


/* JOIN ROOM */

document
.getElementById("joinBtn")
.addEventListener(
"click",
joinRoom
);


async function joinRoom(){

try{

roomCode=
roomInput.value
.trim()
.toUpperCase();

if(roomCode.length!==6){

alert(
"Enter valid 6 character room code"
);

return;

}

const roomRef=
ref(db,"rooms/"+roomCode);

const snapshot=
await get(roomRef);

if(!snapshot.exists()){

alert("Room not found");

return;

}

const data=snapshot.val();

if(data.player2){

alert("Room is full");

return;

}

player="player2";

await update(
roomRef,
{

player2:true,
player2Name:myName

}
);

openGame();

}
catch(error){

console.error(error);

alert(
"Could not join room"
);

}

}


/* OPEN GAME */

function openGame(){

lobby.style.display="none";

game.style.display="block";

roomCodeText.innerText=
roomCode;

listenRoom();

}


/* LISTEN ROOM */

function listenRoom(){

const roomRef=
ref(db,"rooms/"+roomCode);

onValue(
roomRef,
snapshot=>{

const data=snapshot.val();

if(!data){

alert("Room closed");

location.reload();

return;

}


score1Text.innerText=
data.score1||0;

score2Text.innerText=
data.score2||0;


player1NameText.innerText=
data.player1Name||
"Player 1";

player2NameText.innerText=
data.player2Name||
"Player 2";


if(
data.player1 &&
data.player2
){

playersText.innerText=
"👥 2 Players Connected";


if(
!data.move1 &&
!data.move2 &&
!data.finished
){

statusText.innerText=
"Choose your move";

startTimer();

}

}
else{

playersText.innerText=
"⏳ Waiting for Player 2...";

statusText.innerText=
"Waiting for Player 2...";

stopTimer();

}


if(
data.move1 &&
data.move2 &&
!data.finished
){

calculateResult(data);

}


if(data.finished){

resultText.innerText=
data.result||"";

newRoundBtn
.classList
.remove("hidden");

stopTimer();

}

}
);

}


/* CHOICE BUTTONS */

document
.querySelectorAll(".choice")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

makeMove(
button.dataset.move
);

}
);

});


/* MAKE MOVE */

async function makeMove(move){

if(myMove) return;

myMove=move;

document
.querySelectorAll(".choice")
.forEach(button=>{

button.disabled=true;

});


try{

const roomRef=
ref(db,"rooms/"+roomCode);

if(player==="player1"){

await update(
roomRef,
{move1:move}
);

}
else{

await update(
roomRef,
{move2:move}
);

}

statusText.innerText=
"✅ Move selected. Waiting for opponent...";

}
catch(error){

console.error(error);

myMove="";

document
.querySelectorAll(".choice")
.forEach(button=>{

button.disabled=false;

});

}

}


/* RESULT */

async function calculateResult(data){

if(processingResult) return;

processingResult=true;

stopTimer();

let score1=
Number(data.score1||0);

let score2=
Number(data.score2||0);

let result="";


if(data.move1===data.move2){

result="🤝 Draw!";

}

else if(

(
data.move1==="stone" &&
data.move2==="scissors"
)

||

(
data.move1==="paper" &&
data.move2==="stone"
)

||

(
data.move1==="scissors" &&
data.move2==="paper"
)

){

score1++;

result=
"🏆 "+
(data.player1Name||"Player 1")+
" Wins!";

}

else{

score2++;

result=
"🏆 "+
(data.player2Name||"Player 2")+
" Wins!";

}


await update(
ref(db,"rooms/"+roomCode),
{

score1:score1,
score2:score2,
result:result,
finished:true

}
);

}


/* NEW ROUND */

newRoundBtn.addEventListener(
"click",
newRound
);


async function newRound(){

myMove="";

processingResult=false;

stopTimer();

document
.querySelectorAll(".choice")
.forEach(button=>{

button.disabled=false;

});

resultText.innerText="";

statusText.innerText=
"Choose your move";

newRoundBtn
.classList
.add("hidden");


await update(
ref(db,"rooms/"+roomCode),
{

move1:"",
move2:"",
result:"",
finished:false

}
);


/*
IMPORTANT:
Timer starts from EXACTLY 60
*/

startTimer();

}


/* =================================
   60 SECOND COUNTDOWN
   60 → 59 → 58 → ... → 0
================================= */

function startTimer(){

/* Don't start duplicate timers */

if(timer!==null){

return;

}


/* ALWAYS START AT 60 */

let seconds=60;

timerText.innerText="60";

timerBox.classList.remove("warning");


timer=setInterval(
async()=>{

seconds--;


/* SHOW CURRENT SECOND */

timerText.innerText=
String(seconds);


/* Warning under 10 seconds */

if(seconds<=10){

timerBox.classList.add("warning");

}


/* TIME UP */

if(seconds<=0){

stopTimer();

try{

const snapshot=
await get(
ref(db,"rooms/"+roomCode)
);

const data=snapshot.val();

if(!data) return;


/*
Only finish automatically
if neither player selected.
*/

if(
!data.move1 &&
!data.move2 &&
!data.finished
){

await update(
ref(db,"rooms/"+roomCode),
{

result:"⏰ Time Up!",
finished:true

}
);

}

}
catch(error){

console.error(error);

}

}

},
1000
);

}


/* STOP TIMER */

function stopTimer(){

if(timer!==null){

clearInterval(timer);

timer=null;

}

timerBox.classList.remove("warning");

}


/* LEAVE ROOM */

document
.getElementById("leaveBtn")
.addEventListener(
"click",
leaveRoom
);


async function leaveRoom(){

if(
!confirm("Leave this room?")
){

return;

}

stopTimer();

try{

if(player==="player1"){

await remove(
ref(db,"rooms/"+roomCode)
);

}
else{

await update(
ref(db,"rooms/"+roomCode),
{

player2:false,
player2Name:"",
move2:""

}
);

}

}
catch(error){

console.error(error);

}

location.reload();

}

</script>

</body>
</html>
