<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Paper Scissors</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 22px 16px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    h2 {
      margin: 8px 0;
    }

    .player-name {
      font-size: 19px;
      font-weight: bold;
      margin: 12px 0;
    }

    .small {
      color: #cbd5e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 0;
      outline: 0;
      border-radius: 10px;
      font-size: 17px;
      text-align: center;
      margin: 10px 0;
      text-transform: uppercase;
    }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      background: #22c55e;
      color: white;
      font-weight: bold;
    }

    .secondary {
      background: #3b82f6;
      color: white;
      padding: 14px;
      width: 100%;
      margin-top: 8px;
    }

    .danger {
      background: #ef4444;
      color: white;
      padding: 12px 20px;
      margin-top: 10px;
    }

    .home-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .home-buttons button {
      flex: 1;
    }

    .choice {
      width: 85px;
      height: 75px;
      margin: 6px;
      font-size: 40px;
      background: white;
    }

    .choice:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #game,
    #leaderboard,
    #history {
      display: none;
    }

    .room {
      margin: 15px 0;
      font-size: 20px;
    }

    .room-code {
      background: #334155;
      padding: 8px 15px;
      border-radius: 10px;
      display: inline-block;
      letter-spacing: 2px;
    }

    .score {
      display: flex;
      justify-content: space-around;
      background: #334155;
      border-radius: 14px;
      padding: 15px;
      margin: 15px 0;
    }

    .score strong {
      font-size: 28px;
    }

    .timer {
      font-size: 26px;
      font-weight: bold;
      margin: 15px;
    }

    .status {
      min-height: 25px;
      margin: 12px 0;
    }

    .result {
      min-height: 60px;
      margin: 15px 0;
      font-size: 24px;
      font-weight: bold;
    }

    .list-item {
      background: #334155;
      padding: 13px;
      margin: 8px 0;
      border-radius: 12px;
      text-align: left;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HOME -->

  <div id="lobby" class="card">

    <h1>🪨 📄 ✂️</h1>

    <h2>Stone Paper Scissors</h2>

    <div class="player-name" id="lobbyPlayer">
      Player
    </div>

    <div class="small">
      🎮 2 Player Online Game
    </div>

    <br>

    <button class="main-btn" id="createBtn">
      🎮 Create Room
    </button>

    <p>OR</p>

    <input
      id="roomInput"
      maxlength="6"
      placeholder="ROOM CODE"
    >

    <button class="main-btn" id="joinBtn">
      🔗 Join Room
    </button>

    <div class="home-buttons">

      <button
        class="secondary"
        id="leaderboardBtn">
        🏆 Leaderboard
      </button>

      <button
        class="secondary"
        id="historyBtn">
        📜 History
      </button>

    </div>

    <p id="lobbyStatus" class="small"></p>

  </div>


  <!-- GAME -->

  <div id="game" class="card">

    <h1>🪨 📄 ✂️</h1>

    <div class="room">
      Room:
      <div class="room-code" id="roomCode"></div>
    </div>

    <div class="score">

      <div>
        <span id="player1Name">Player 1</span>
        <br>
        <strong id="score1">0</strong>
      </div>

      <div>
        <span id="player2Name">Player 2</span>
        <br>
        <strong id="score2">0</strong>
      </div>

    </div>

    <div class="timer">
      ⏱️ <span id="timer">15</span>
    </div>

    <div id="players" class="status">
      Waiting for Player 2...
    </div>

    <div id="status" class="status">
      Waiting for players...
    </div>

    <div>

      <button class="choice" data-move="stone">🪨</button>

      <button class="choice" data-move="paper">📄</button>

      <button class="choice" data-move="scissors">✂️</button>

    </div>

    <div id="result" class="result"></div>

    <button
      id="newRoundBtn"
      class="secondary hidden">
      🔄 New Round
    </button>

    <button
      id="leaveBtn"
      class="danger">
      🚪 Leave Room
    </button>

  </div>


  <!-- LEADERBOARD -->

  <div id="leaderboard" class="card">

    <h1>🏆</h1>

    <h2>Leaderboard</h2>

    <div id="leaderboardList">
      No matches played yet.
    </div>

    <button
      class="secondary"
      id="backFromLeaderboard">
      ← Back
    </button>

  </div>


  <!-- HISTORY -->

  <div id="history" class="card">

    <h1>📜</h1>

    <h2>Match History</h2>

    <div id="historyList">
      No matches played yet.
    </div>

    <button
      class="secondary"
      id="backFromHistory">
      ← Back
    </button>

  </div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  get,
  update,
  remove,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC5nCnRk8rHzEZX7BylT1T9T5lAWPkRQsjw",

  authDomain:
    "stonepaperscissors-598d1.firebaseapp.com",

  databaseURL:
    "https://stonepaperscissors-598d1-default-rtdb.firebaseio.com",

  projectId:
    "stonepaperscissors-598d1",

  storageBucket:
    "stonepaperscissors-598d1.firebasestorage.app",

  messagingSenderId:
    "699484749817",

  appId:
    "1:699484749817:web:861e86fe13c4bf94ef8728",

  measurementId:
    "G-5HD3MDN5EC"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* =========================
   TELEGRAM
========================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if (tg) {

  tg.ready();

  tg.expand();

}


let telegramUser = null;


if (
  tg &&
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user
) {

  telegramUser =
    tg.initDataUnsafe.user;

}


let myName = "Player";


if (telegramUser) {

  if (telegramUser.username) {

    myName =
      "@" + telegramUser.username;

  }

  else if (telegramUser.first_name) {

    myName =
      telegramUser.first_name;

  }

}


/* =========================
   VARIABLES
========================= */

let roomCode = "";
let player = "";
let timer = null;
let myMove = "";
let processingResult = false;


/* =========================
   ELEMENTS
========================= */

const lobby =
  document.getElementById("lobby");

const game =
  document.getElementById("game");

const leaderboard =
  document.getElementById("leaderboard");

const history =
  document.getElementById("history");

const roomInput =
  document.getElementById("roomInput");

const lobbyPlayer =
  document.getElementById("lobbyPlayer");

const roomCodeText =
  document.getElementById("roomCode");

const playersText =
  document.getElementById("players");

const statusText =
  document.getElementById("status");

const resultText =
  document.getElementById("result");

const timerText =
  document.getElementById("timer");

const score1Text =
  document.getElementById("score1");

const score2Text =
  document.getElementById("score2");

const player1NameText =
  document.getElementById("player1Name");

const player2NameText =
  document.getElementById("player2Name");

const newRoundBtn =
  document.getElementById("newRoundBtn");


lobbyPlayer.innerText =
  myName;


/* =========================
   SCREEN FUNCTIONS
========================= */

function showLobby() {

  lobby.style.display = "block";

  game.style.display = "none";

  leaderboard.style.display = "none";

  history.style.display = "none";

}


function showGame() {

  lobby.style.display = "none";

  game.style.display = "block";

  leaderboard.style.display = "none";

  history.style.display = "none";

}


function showLeaderboard() {

  lobby.style.display = "none";

  game.style.display = "none";

  leaderboard.style.display = "block";

  history.style.display = "none";

  loadLeaderboard();

}


function showHistory() {

  lobby.style.display = "none";

  game.style.display = "none";

  leaderboard.style.display = "none";

  history.style.display = "block";

  loadHistory();

}


/* =========================
   CREATE ROOM
========================= */

document
  .getElementById("createBtn")
  .addEventListener(
    "click",
    createRoom
  );


async function createRoom() {

  try {

    let newCode = "";

    while (!newCode) {

      const code =
        Math.random()
          .toString(36)
          .substring(2, 8)
          .toUpperCase();

      const existing =
        await get(
          ref(db, "rooms/" + code)
        );

      if (!existing.exists()) {

        newCode = code;

      }

    }


    roomCode = newCode;

    player = "player1";

    await set(
      ref(db, "rooms/" + roomCode),
      {

        player1: true,

        player2: false,

        player1Name: myName,

        player2Name: "",

        move1: "",

        move2: "",

        score1: 0,

        score2: 0,

        result: "",

        round: 1,

        finished: false

      }
    );


    openGame();

  }

  catch (error) {

    console.error(error);

    alert(
      "Could not create room"
    );

  }

}


/* =========================
   JOIN ROOM
========================= */

document
  .getElementById("joinBtn")
  .addEventListener(
    "click",
    joinRoom
  );


async function joinRoom() {

  try {

    roomCode =
      roomInput.value
        .trim()
        .toUpperCase();


    if (roomCode.length !== 6) {

      alert(
        "Enter a valid 6 character room code"
      );

      return;

    }


    const roomRef =
      ref(
        db,
        "rooms/" + roomCode
      );


    const snapshot =
      await get(roomRef);


    if (!snapshot.exists()) {

      alert("Room not found");

      return;

    }


    const data =
      snapshot.val();


    if (data.player2 === true) {

      alert("Room is full");

      return;

    }


    player = "player2";


    await update(
      roomRef,
      {

        player2: true,

        player2Name: myName

      }
    );


    openGame();

  }

  catch (error) {

    console.error(error);

    alert(
      "Could not join room"
    );

  }

}


/* =========================
   OPEN GAME
========================= */

function openGame() {

  showGame();

  roomCodeText.innerText =
    roomCode;

  listenRoom();

}


/* =========================
   LISTEN ROOM
========================= */

function listenRoom() {

  const roomRef =
    ref(
      db,
      "rooms/" + roomCode
    );


  onValue(
    roomRef,
    snapshot => {

      const data =
        snapshot.val();


      if (!data) {

        alert("Room closed");

        location.reload();

        return;

      }


      score1Text.innerText =
        data.score1 || 0;

      score2Text.innerText =
        data.score2 || 0;


      player1NameText.innerText =
        data.player1Name ||
        "Player 1";


      player2NameText.innerText =
        data.player2Name ||
        "Player 2";


      if (
        data.player1 &&
        data.player2
      ) {

        playersText.innerText =
          "👥 2 Players Connected";


        if (
          !data.move1 &&
          !data.move2 &&
          !data.finished
        ) {

          statusText.innerText =
            "Choose your move";

          startTimer();

        }

      }

      else {

        playersText.innerText =
          "⏳ Waiting for Player 2...";

        statusText.innerText =
          "Waiting for Player 2...";

        stopTimer();

      }


      if (
        data.move1 &&
        data.move2 &&
        !data.finished
      ) {

        calculateResult(data);

      }


      if (data.finished) {

        resultText.innerText =
          data.result || "";

        newRoundBtn
          .classList
          .remove("hidden");

        stopTimer();

      }

    }
  );

}


/* =========================
   CHOICE BUTTONS
========================= */

document
  .querySelectorAll(".choice")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        makeMove(
          button.dataset.move
        );

      }
    );

  });


/* =========================
   MAKE MOVE
========================= */

async function makeMove(move) {

  if (myMove) return;

  if (!roomCode || !player) return;


  myMove = move;


  document
    .querySelectorAll(".choice")
    .forEach(button => {

      button.disabled = true;

    });


  const roomRef =
    ref(
      db,
      "rooms/" + roomCode
    );


  try {

    if (player === "player1") {

      await update(
        roomRef,
        {
          move1: move
        }
      );

    }

    else {

      await update(
        roomRef,
        {
          move2: move
        }
      );

    }


    statusText.innerText =
      "✅ Move selected. Waiting for opponent...";

  }

  catch (error) {

    console.error(error);

    myMove = "";

    document
      .querySelectorAll(".choice")
      .forEach(button => {

        button.disabled = false;

      });

    alert(
      "Could not save move"
    );

  }

}


/* =========================
   CALCULATE RESULT
========================= */

async function calculateResult(data) {

  if (processingResult) return;

  processingResult = true;

  stopTimer();


  let result = "";

  let score1 =
    Number(data.score1 || 0);

  let score2 =
    Number(data.score2 || 0);


  if (
    data.move1 === data.move2
  ) {

    result =
      "🤝 Draw!";

  }

  else if (

    (
      data.move1 === "stone" &&
      data.move2 === "scissors"
    )

    ||

    (
      data.move1 === "paper" &&
      data.move2 === "stone"
    )

    ||

    (
      data.move1 === "scissors" &&
      data.move2 === "paper"
    )

  ) {

    result =
      "🏆 " +
      (data.player1Name || "Player 1") +
      " Wins!";

    score1++;

  }

  else {

    result =
      "🏆 " +
      (data.player2Name || "Player 2") +
      " Wins!";

    score2++;

  }


  try {

    await update(
      ref(
        db,
        "rooms/" + roomCode
      ),
      {

        score1: score1,

        score2: score2,

        result: result,

        finished: true

      }
    );


    saveMatch(
      data,
      result
    );

  }

  catch (error) {

    console.error(error);

  }


  resultText.innerText =
    result;

  newRoundBtn
    .classList
    .remove("hidden");

}


/* =========================
   NEW ROUND
========================= */

newRoundBtn.addEventListener(
  "click",
  newRound
);


async function newRound() {

  try {

    myMove = "";

    processingResult = false;

    stopTimer();


    document
      .querySelectorAll(".choice")
      .forEach(button => {

        button.disabled = false;

      });


    resultText.innerText = "";

    statusText.innerText =
      "Choose your move";


    newRoundBtn
      .classList
      .add("hidden");


    const snapshot =
      await get(
        ref(
          db,
          "rooms/" + roomCode
        )
      );


    const data =
      snapshot.val();


    if (!data) return;


    const nextRound =
      Number(data.round || 1) + 1;


    await update(
      ref(
        db,
        "rooms/" + roomCode
      ),
      {

        move1: "",

        move2: "",

        result: "",

        finished: false,

        round: nextRound

      }
    );


    startTimer();

  }

  catch (error) {

    console.error(error);

    alert(
      "Could not start new round"
    );

  }

}


/* =========================
   TIMER
========================= */

function startTimer() {

  if (timer) return;

  let seconds = 15;

  timerText.innerText =
    seconds;


  timer =
    setInterval(
      async () => {

        seconds--;

        timerText.innerText =
          seconds;


        if (seconds <= 0) {

          stopTimer();


          try {

            const snapshot =
              await get(
                ref(
                  db,
                  "rooms/" + roomCode
                )
              );


            const data =
              snapshot.val();


            if (!data) return;


            if (
              !data.move1 &&
              !data.move2 &&
              !data.finished
            ) {

              await update(
                ref(
                  db,
                  "rooms/" + roomCode
                ),
                {

                  result:
                    "⏰ Time Up!",

                  finished:
                    true

                }
              );

            }

          }

          catch (error) {

            console.error(error);

          }

        }

      },
      1000
    );

}


function stopTimer() {

  if (timer) {

    clearInterval(timer);

    timer = null;

  }

}


/* =========================
   LEAVE ROOM
========================= */

document
  .getElementById("leaveBtn")
  .addEventListener(
    "click",
    leaveRoom
  );


async function leaveRoom() {

  if (
    !confirm("Leave this room?")
  ) {

    return;

  }


  stopTimer();


  try {

    if (player === "player1") {

      await remove(
        ref(
          db,
          "rooms/" + roomCode
        )
      );

    }

    else {

      await update(
        ref(
          db,
          "rooms/" + roomCode
        ),
        {

          player2: false,

          player2Name: "",

          move2: ""

        }
      );

    }

  }

  catch (error) {

    console.error(error);

  }


  location.reload();

}


/* =========================
   LOCAL MATCH HISTORY
========================= */

function saveMatch(data, result) {

  try {

    const matches =
      JSON.parse(
        localStorage.getItem(
          "sps_matches"
        ) || "[]"
      );


    matches.unshift({

      player1:
        data.player1Name ||
        "Player 1",

      player2:
        data.player2Name ||
        "Player 2",

      result:
        result,

      time:
        new Date().toLocaleString()

    });


    localStorage.setItem(
      "sps_matches",
      JSON.stringify(
        matches.slice(0, 50)
      )
    );

  }

  catch (error) {

    console.error(error);

  }

}


/* =========================
   HISTORY SCREEN
========================= */

function loadHistory() {

  const list =
    document.getElementById(
      "historyList"
    );


  let matches = [];


  try {

    matches =
      JSON.parse(
        localStorage.getItem(
          "sps_matches"
        ) || "[]"
      );

  }

  catch (error) {

    matches = [];

  }


  if (!matches.length) {

    list.innerHTML =
      "No matches played yet.";

    return;

  }


  list.innerHTML = "";


  matches.forEach(match => {

    const item =
      document.createElement("div");

    item.className =
      "list-item";

    item.innerHTML =
      "<b>" +
      escapeHTML(match.player1) +
      "</b> vs <b>" +
      escapeHTML(match.player2) +
      "</b><br>" +
      escapeHTML(match.result) +
      "<br><span class='small'>" +
      escapeHTML(match.time) +
      "</span>";

    list.appendChild(item);

  });

}


/* =========================
   LOCAL LEADERBOARD
========================= */

function loadLeaderboard() {

  const list =
    document.getElementById(
      "leaderboardList"
    );


  let matches = [];


  try {

    matches =
      JSON.parse(
        localStorage.getItem(
          "sps_matches"
        ) || "[]"
      );

  }

  catch (error) {

    matches = [];

  }


  if (!matches.length) {

    list.innerHTML =
      "No matches played yet.";

    return;

  }


  const scores = {};


  matches.forEach(match => {

    const text =
      match.result || "";


    if (
      text.includes(
        match.player1
      )
    ) {

      scores[match.player1] =
        (scores[match.player1] || 0) + 1;

    }


    if (
      text.includes(
        match.player2
      )
    ) {

      scores[match.player2] =
        (scores[match.player2] || 0) + 1;

    }

  });


  const sorted =
    Object.entries(scores)
      .sort(
        (a, b) => b[1] - a[1]
      );


  if (!sorted.length) {

    list.innerHTML =
      "No wins yet.";

    return;

  }


  list.innerHTML = "";


  sorted.forEach(
    ([name, wins], index) => {

      const item =
        document.createElement("div");

      item.className =
        "list-item";

      item.innerHTML =
        "<b>#" +
        (index + 1) +
        "</b> " +
        escapeHTML(name) +
        " — 🏆 " +
        wins +
        " wins";

      list.appendChild(item);

    }
  );

}


/* =========================
   SAFE TEXT
========================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   NAVIGATION
========================= */

document
  .getElementById("leaderboardBtn")
  .addEventListener(
    "click",
    showLeaderboard
  );


document
  .getElementById("historyBtn")
  .addEventListener(
    "click",
    showHistory
  );


document
  .getElementById("backFromLeaderboard")
  .addEventListener(
    "click",
    showLobby
  );


document
  .getElementById("backFromHistory")
  .addEventListener(
    "click",
    showLobby
  );


/* START */

showLobby();

</script>

</body>
</html>
